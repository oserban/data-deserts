<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Deserts — country details</title>
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#172230}
    body{overflow:hidden}
  </style>
</head>
<body>
  <iframe id="detailsFrame" title="Data Deserts country details"></iframe>
  <script>
    const requested = Number(new URLSearchParams(location.search).get("columns"));
    const columns = Number.isInteger(requested) && requested >= 1 && requested <= 32 ? requested : 16;
    document.getElementById("detailsFrame").src =
      "../app/index.html?remote=1&details=1&columns=" + columns;
  </script>
</body>
</html>
