<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Deserts — renderer</title>
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#0f1620}
    body{overflow:hidden}
    .mobile-invite{position:fixed;right:1.25rem;top:1.25rem;z-index:10;display:flex;align-items:center;gap:.8rem;padding:.7rem .85rem;color:#eef4f8;background:rgba(15,22,32,.94);border:1px solid #334354;border-radius:.75rem;box-shadow:0 .5rem 2rem #0009;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;pointer-events:none}
    .mobile-invite img{width:clamp(9rem,10vw,16rem);height:clamp(9rem,10vw,16rem);padding:.3rem;border-radius:.4rem;background:#fff}
    .mobile-invite b,.mobile-invite span{display:block}.mobile-invite b{font-size:clamp(.8rem,1vw,1.15rem)}.mobile-invite span{max-width:12rem;margin-top:.3rem;color:#a9b7c4;font-size:clamp(.65rem,.75vw,.9rem);line-height:1.35}
  </style>
</head>
<body>
  <iframe id="rendererFrame" title="Data Deserts map renderer"></iframe>
  <aside class="mobile-invite" aria-label="Mobile country controller">
    <img id="mobileControllerQr" alt="QR code for the mobile country controller" />
    <div><b>Select countries</b><span>Scan with your phone to choose countries for the information panel.</span></div>
  </aside>
  <script>
    (function () {
      "use strict";
      var params = new URLSearchParams(location.search);
      var applicationBase = new URL(".", location.href);
      var publicBase = applicationBase;
      if (params.get("publicUrl")) {
        try {
          publicBase = new URL(params.get("publicUrl"));
          if (!publicBase.pathname.endsWith("/")) publicBase.pathname += "/";
        } catch (error) { /* Use current origin. */ }
      }
      var mobileUrl = new URL("mini-controller", publicBase);
      if (params.get("ws")) mobileUrl.searchParams.set("ws", params.get("ws"));
      document.getElementById("mobileControllerQr").src =
        new URL("qr?text=" + encodeURIComponent(mobileUrl.href), applicationBase).href;
      var inner = new URLSearchParams({ remote: "1" });
      if (params.get("ws")) inner.set("ws", params.get("ws"));
      document.getElementById("rendererFrame").src = "app/index.html?" + inner.toString();
    }());
  </script>
</body>
</html>
